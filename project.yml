name: EnveKeep
options:
  bundleIdPrefix: com.enve
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

packages:
  ZIPFoundation:
    url: https://github.com/weichsel/ZIPFoundation.git
    exactVersion: 0.9.20

settings:
  base:
    SWIFT_VERSION: "6.0"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    TARGETED_DEVICE_FAMILY: "1"

targets:
  EnveKeep:
    type: application
    platform: iOS
    sources:
      - path: EnveKeep
    dependencies:
      - package: ZIPFoundation
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.enve.keep
        PRODUCT_NAME: EnveKeep
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        CODE_SIGN_STYLE: Automatic
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        ENABLE_USER_SCRIPT_SANDBOXING: YES
        GENERATE_INFOPLIST_FILE: NO
    info:
      path: EnveKeep/Info.plist
      properties:
        CFBundleDisplayName: Enve Keep
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSRequiresIPhoneOS: true
        ITSAppUsesNonExemptEncryption: false
        NSCameraUsageDescription: Take photos of receipts, products and documents to keep with your records.
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UILaunchScreen:
          UIColorName: LaunchBackground
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UIFileSharingEnabled: false

  EnveKeepTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: EnveKeepTests
    dependencies:
      - target: EnveKeep
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.enve.keep.tests
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: $(BUILT_PRODUCTS_DIR)/EnveKeep.app/EnveKeep
        BUNDLE_LOADER: $(TEST_HOST)

schemes:
  EnveKeep:
    build:
      targets:
        EnveKeep: all
        EnveKeepTests: [test]
    test:
      targets:
        - EnveKeepTests
